
name: Kubernetes CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f app/index.html
          test -f app/Dockerfile
          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          echo "All required files exist."

      - name: Build Docker image
        run: docker build -t k8s-cicd-app:${{ github.sha }} ./app

      - name: Start and test web application
        run: |
          docker run -d --name web-test -p 8080:80 k8s-cicd-app:${{ github.sha }}

          for attempt in {1..10}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Web application test passed!"
              docker rm -f web-test
              exit 0
            fi
            sleep 2
          done

          docker logs web-test
          docker rm -f web-test
          exit 1


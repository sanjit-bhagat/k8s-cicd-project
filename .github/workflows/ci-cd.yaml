
name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f app/index.html
          test -f app/Dockerfile
          test -f k8s/namespace.yaml
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          echo "All required files exist."

      - name: Validate Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is missing."
            exit 1
          fi

          echo "IMAGE_NAME=${DOCKERHUB_USERNAME,,}/k8s-cicd-app" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$IMAGE_NAME:latest" \
            ./app

      - name: Test web application
        run: |
          docker run -d --name web-test \
            -p 8080:80 "$IMAGE_NAME:${GITHUB_SHA}"

          for attempt in {1..10}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Web application test passed!"
              docker rm -f web-test
              exit 0
            fi
            sleep 2
          done

          docker logs web-test
          docker rm -f web-test
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${DOCKERHUB_USERNAME,,}/k8s-cicd-app"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

  deploy-to-kubernetes:
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Kubernetes access
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot read Kubernetes context."
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot access Kubernetes nodes."
          }

          kubectl get deployment web-app -n cicd-project
          if ($LASTEXITCODE -ne 0) {
            throw "Deployment web-app was not found."
          }

      - name: Deploy image to Kind
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $image = "$($env:DOCKERHUB_USERNAME.ToLower())/k8s-cicd-app:$($env:IMAGE_TAG)"

          $containerName = kubectl get deployment web-app `
            -n cicd-project `
            -o "jsonpath={.spec.template.spec.containers[0].name}"

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($containerName)) {
            throw "Could not find the web-app container."
          }

          Write-Host "Deploying image: $image"

          kubectl set image deployment/web-app `
            -n cicd-project `
            "$($containerName)=$image"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update Deployment image."
          }

          kubectl rollout status deployment/web-app `
            -n cicd-project `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed."
          }

          kubectl get deployment web-app -n cicd-project
          kubectl get pods -n cicd-project

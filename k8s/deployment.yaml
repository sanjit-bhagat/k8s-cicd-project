
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: cicd-project

spec:
  replicas: 4

  selector:
    matchLabels:
      app: k8s-cicd-app

  template:
    metadata:
      labels:
        app: k8s-cicd-app

    spec:
      containers:
        - name: web-app
          image: sanjitbhagat2026/k8s-cicd-app:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

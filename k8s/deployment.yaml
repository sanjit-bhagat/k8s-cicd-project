
apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: cicd-project

spec:
  replicas: 2

  selector:
    matchLabels:
      app: k8s-cicd-app

  template:
    metadata:
      labels:
        app: k8s-cicd-app

    spec:
      containers:
        - name: web-app
          image: sanjitbhagat2026/k8s-cicd-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

